name: Bale Manager Expiry Test

on:
  workflow_dispatch:

jobs:
  send-manager-expiry-report:
    runs-on: ubuntu-latest

    env:
      NHOST_NOTIFICATION_EMAIL: ${{ secrets.NHOST_NOTIFICATION_EMAIL }}
      NHOST_NOTIFICATION_PASSWORD: ${{ secrets.NHOST_NOTIFICATION_PASSWORD }}
      BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
      BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
      MANAGER_NAME: "محمد فتحی پور"

    steps:
      - name: Read manager expiry data and send Bale message
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          AUTH_URL = (
              "https://wijabqjyryslediitcrc.auth."
              "eu-central-1.nhost.run/v1/signin/email-password"
          )
          GRAPHQL_URL = (
              "https://wijabqjyryslediitcrc.graphql."
              "eu-central-1.nhost.run/v1"
          )
          DASHBOARD_URL = (
              "https://alirezakhani91.github.io/"
              "dailymarket-expiry/expiry-watch.html"
          )

          email = os.environ.get("NHOST_NOTIFICATION_EMAIL", "").strip()
          password = os.environ.get("NHOST_NOTIFICATION_PASSWORD", "")
          bale_token = os.environ.get("BALE_BOT_TOKEN", "").strip()
          bale_chat_id = os.environ.get("BALE_CHAT_ID", "").strip()
          manager_name = os.environ.get("MANAGER_NAME", "").strip()

          for key, value in {
              "NHOST_NOTIFICATION_EMAIL": email,
              "NHOST_NOTIFICATION_PASSWORD": password,
              "BALE_BOT_TOKEN": bale_token,
              "BALE_CHAT_ID": bale_chat_id,
              "MANAGER_NAME": manager_name,
          }.items():
              if not value:
                  raise SystemExit(f"{key} is missing.")

          def post_json(url, payload, headers=None):
              request_headers = {
                  "Content-Type": "application/json; charset=utf-8"
              }
              if headers:
                  request_headers.update(headers)

              request = urllib.request.Request(
                  url,
                  data=json.dumps(
                      payload,
                      ensure_ascii=False
                  ).encode("utf-8"),
                  headers=request_headers,
                  method="POST",
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=40
                  ) as response:
                      return json.loads(
                          response.read().decode("utf-8")
                      )
              except urllib.error.HTTPError as error:
                  body = error.read().decode(
                      "utf-8",
                      errors="replace"
                  )
                  raise SystemExit(
                      f"HTTP {error.code}: {body}"
                  )

          def format_number(value):
              return f"{int(round(value)):,}"

          auth_data = post_json(
              AUTH_URL,
              {
                  "email": email,
                  "password": password,
              },
          )

          access_token = (
              (auth_data.get("session") or {})
              .get("accessToken")
          )

          if not access_token:
              raise SystemExit(
                  "Nhost login failed: accessToken was not returned."
              )

          tehran = ZoneInfo("Asia/Tehran")
          today_date = datetime.now(tehran).date()
          end_date = today_date + timedelta(days=7)

          query = """
          query ManagerExpiryReport(
            $manager: String!,
            $today: date!,
            $end_date: date!
          ) {
            expiry_batches(
              where: {
                store: {
                  region_manager_name: {
                    _eq: $manager
                  }
                }
                status: {
                  _nin: ["sold", "cancelled", "rejected"]
                }
                expiry_date: {
                  _gte: $today,
                  _lte: $end_date
                }
              }
              order_by: [
                {expiry_date: asc},
                {created_at: desc}
              ]
            ) {
              id
              product_name
              quantity
              unit_price
              expiry_date
              store {
                id
                name
                store_code
              }
            }
          }
          """

          gql_data = post_json(
              GRAPHQL_URL,
              {
                  "query": query,
                  "variables": {
                      "manager": manager_name,
                      "today": today_date.isoformat(),
                      "end_date": end_date.isoformat(),
                  },
              },
              {
                  "Authorization": f"Bearer {access_token}"
              },
          )

          if gql_data.get("errors"):
              raise SystemExit(
                  "GraphQL error: " +
                  json.dumps(
                      gql_data["errors"],
                      ensure_ascii=False
                  )
              )

          rows = (
              gql_data.get("data", {})
              .get("expiry_batches", [])
          )

          buckets = {
              "today": {
                  "rows": 0,
                  "qty": 0.0,
                  "value": 0.0,
              },
              "d1_3": {
                  "rows": 0,
                  "qty": 0.0,
                  "value": 0.0,
              },
              "d4_7": {
                  "rows": 0,
                  "qty": 0.0,
                  "value": 0.0,
              },
          }

          stores = set()

          for row in rows:
              expiry = datetime.strptime(
                  row["expiry_date"],
                  "%Y-%m-%d"
              ).date()

              days_left = (expiry - today_date).days
              quantity = float(row.get("quantity") or 0)
              unit_price = float(row.get("unit_price") or 0)
              value = quantity * unit_price

              store = row.get("store") or {}
              store_key = (
                  store.get("id")
                  or store.get("store_code")
                  or store.get("name")
              )
              if store_key:
                  stores.add(str(store_key))

              if days_left == 0:
                  key = "today"
              elif 1 <= days_left <= 3:
                  key = "d1_3"
              elif 4 <= days_left <= 7:
                  key = "d4_7"
              else:
                  continue

              buckets[key]["rows"] += 1
              buckets[key]["qty"] += quantity
              buckets[key]["value"] += value

          total_rows = sum(
              item["rows"]
              for item in buckets.values()
          )
          total_qty = sum(
              item["qty"]
              for item in buckets.values()
          )
          total_value = sum(
              item["value"]
              for item in buckets.values()
          )

          if total_rows == 0:
              message = (
                  "✅ گزارش پایش انقضا\n\n"
                  f"مدیر محترم منطقه، {manager_name}\n\n"
                  "در حال حاضر برای امروز تا ۷ روز آینده، "
                  "کالای فعال تاریخ‌نزدیکی در فروشگاه‌های "
                  "تحت نظارت شما ثبت نشده است.\n\n"
                  f"مشاهده داشبورد:\n{DASHBOARD_URL}"
              )
          else:
              message = (
                  "⚠️ گزارش پایش انقضا\n\n"
                  f"مدیر محترم منطقه، {manager_name}\n\n"
                  "کالاهای فعال ثبت‌شده در فروشگاه‌های "
                  "تحت نظارت شما:\n\n"
                  "🔴 منقضی‌شونده امروز\n"
                  f"• {format_number(buckets['today']['rows'])} قلم\n"
                  f"• {format_number(buckets['today']['qty'])} واحد\n"
                  f"• {format_number(buckets['today']['value'])} ریال\n\n"
                  "🟠 یک تا سه روز آینده\n"
                  f"• {format_number(buckets['d1_3']['rows'])} قلم\n"
                  f"• {format_number(buckets['d1_3']['qty'])} واحد\n"
                  f"• {format_number(buckets['d1_3']['value'])} ریال\n\n"
                  "🟡 چهار تا هفت روز آینده\n"
                  f"• {format_number(buckets['d4_7']['rows'])} قلم\n"
                  f"• {format_number(buckets['d4_7']['qty'])} واحد\n"
                  f"• {format_number(buckets['d4_7']['value'])} ریال\n\n"
                  "📌 جمع وضعیت فعال\n"
                  f"• {format_number(total_rows)} قلم\n"
                  f"• {format_number(total_qty)} واحد\n"
                  f"• {format_number(total_value)} ریال\n"
                  f"• {format_number(len(stores))} فروشگاه درگیر\n\n"
                  "لطفاً کالاهای نیازمند اقدام را بررسی کنید.\n\n"
                  f"مشاهده جزئیات:\n{DASHBOARD_URL}"
              )

          bale_url = (
              f"https://tapi.bale.ai/bot{bale_token}/sendMessage"
          )

          bale_result = post_json(
              bale_url,
              {
                  "chat_id": bale_chat_id,
                  "text": message,
              },
          )

          if not bale_result.get("ok"):
              raise SystemExit(
                  "Bale API error: " +
                  str(
                      bale_result.get(
                          "description",
                          "Unknown error"
                      )
                  )
              )

          print(
              "Manager expiry report sent successfully. "
              f"Rows: {total_rows}"
          )
          PY
