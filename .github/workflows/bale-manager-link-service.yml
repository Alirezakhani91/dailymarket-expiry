name: Bale Manager Link Service

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: bale-manager-link-service
  cancel-in-progress: false

jobs:
  connect-managers:
    runs-on: ubuntu-latest

    env:
      NHOST_NOTIFICATION_EMAIL: ${{ secrets.NHOST_NOTIFICATION_EMAIL }}
      NHOST_NOTIFICATION_PASSWORD: ${{ secrets.NHOST_NOTIFICATION_PASSWORD }}
      BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}

    steps:
      - name: Connect Bale chats to region managers
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          AUTH_URL = "https://wijabqjyryslediitcrc.auth.eu-central-1.nhost.run/v1/signin/email-password"
          GRAPHQL_URL = "https://wijabqjyryslediitcrc.graphql.eu-central-1.nhost.run/v1"

          email = os.environ["NHOST_NOTIFICATION_EMAIL"].strip()
          password = os.environ["NHOST_NOTIFICATION_PASSWORD"]
          bale_token = os.environ["BALE_BOT_TOKEN"].strip()

          def post_json(url, payload, headers=None):
              request_headers = {"Content-Type": "application/json; charset=utf-8"}
              if headers:
                  request_headers.update(headers)

              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
                  headers=request_headers,
                  method="POST",
              )

              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"HTTP {error.code}: {body}")

          def get_json(url):
              try:
                  with urllib.request.urlopen(url, timeout=60) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"HTTP {error.code}: {body}")

          def send_message(chat_id, text):
              result = post_json(
                  f"https://tapi.bale.ai/bot{bale_token}/sendMessage",
                  {"chat_id": str(chat_id), "text": text},
              )
              if not result.get("ok"):
                  raise RuntimeError(str(result.get("description", "Bale API error")))

          def normalize_code(text):
              value = str(text or "").strip().upper()
              if value.startswith("/START"):
                  parts = value.split(maxsplit=1)
                  if len(parts) == 1:
                      return ""
                  value = parts[1]
              return re.sub(r"[^A-Z0-9]", "", value)

          auth_data = post_json(AUTH_URL, {"email": email, "password": password})
          access_token = (auth_data.get("session") or {}).get("accessToken")
          if not access_token:
              raise SystemExit("Nhost login failed.")

          gql_headers = {
              "Authorization": f"Bearer {access_token}",
              "x-hasura-role": "notification_service",
          }

          managers_query = """
          query RegionManagersForBale {
            user_roles(where: {bale_link_code: {_is_null: false}}) {
              id
              manager_name
              bale_link_code
            }
          }
          """

          manager_response = post_json(
              GRAPHQL_URL,
              {"query": managers_query, "variables": {}},
              gql_headers,
          )

          if manager_response.get("errors"):
              raise SystemExit(
                  "Manager query failed: "
                  + json.dumps(manager_response["errors"], ensure_ascii=False)
              )

          managers = manager_response.get("data", {}).get("user_roles", []) or []
          code_map = {
              normalize_code(item.get("bale_link_code")): item
              for item in managers
              if normalize_code(item.get("bale_link_code"))
          }

          updates_response = get_json(
              f"https://tapi.bale.ai/bot{bale_token}/getUpdates?limit=100&timeout=0"
          )
          if not updates_response.get("ok"):
              raise SystemExit(str(updates_response.get("description", "getUpdates failed")))

          updates = updates_response.get("result") or []
          max_update_id = None
          connected_count = 0

          insert_mutation = """
          mutation ConnectBaleChat(
            $user_role_id: uuid!
            $chat_id: String!
            $connected_at: timestamptz!
          ) {
            insert_bale_manager_chats_one(
              object: {
                user_role_id: $user_role_id
                bale_chat_id: $chat_id
                notifications_enabled: true
                connected_at: $connected_at
              }
              on_conflict: {
                constraint: bale_manager_chats_manager_chat_unique
                update_columns: [notifications_enabled, connected_at]
              }
            ) {
              id
            }
          }
          """

          for update in updates:
              update_id = update.get("update_id")
              if isinstance(update_id, int):
                  max_update_id = update_id if max_update_id is None else max(max_update_id, update_id)

              message = update.get("message") or {}
              chat = message.get("chat") or {}
              chat_id = chat.get("id")
              chat_type = chat.get("type")
              text = str(message.get("text") or "").strip()

              if chat_id is None or not text:
                  continue
              if chat_type and chat_type != "private":
                  continue

              code = normalize_code(text)

              if text.upper().startswith("/START") and not code:
                  send_message(
                      chat_id,
                      "سلام 👋\n\nبرای فعال‌سازی گزارش پایش انقضا، کد اختصاصی مدیر منطقه را ارسال کنید."
                  )
                  continue

              manager = code_map.get(code)
              if not manager:
                  send_message(
                      chat_id,
                      "کد اتصال معتبر نیست.\n\nلطفاً کد اختصاصی مدیر منطقه را دقیقاً ارسال کنید."
                  )
                  continue

              mutation_response = post_json(
                  GRAPHQL_URL,
                  {
                      "query": insert_mutation,
                      "variables": {
                          "user_role_id": manager["id"],
                          "chat_id": str(chat_id),
                          "connected_at": datetime.now(timezone.utc).isoformat(),
                      },
                  },
                  gql_headers,
              )

              if mutation_response.get("errors"):
                  print(json.dumps(mutation_response["errors"], ensure_ascii=False))
                  send_message(
                      chat_id,
                      "اتصال حساب بله با خطا مواجه شد. لطفاً با مدیر پلتفرم تماس بگیرید."
                  )
                  continue

              connected_count += 1
              send_message(
                  chat_id,
                  "✅ اتصال اعلان پایش انقضا با موفقیت انجام شد.\n\n"
                  f"مدیر منطقه: {manager.get('manager_name') or 'نامشخص'}\n\n"
                  "از این پس گزارش اختصاصی کالاهای تاریخ‌نزدیک در دو نوبت روزانه برای این حساب ارسال می‌شود."
              )

          if max_update_id is not None:
              confirm_url = (
                  f"https://tapi.bale.ai/bot{bale_token}/getUpdates?"
                  + urllib.parse.urlencode({"offset": max_update_id + 1, "limit": 1, "timeout": 0})
              )
              get_json(confirm_url)

          print(
              "Multi-chat Bale link completed. "
              f"Managers: {len(managers)}, updates: {len(updates)}, connected: {connected_count}"
          )
          PY
