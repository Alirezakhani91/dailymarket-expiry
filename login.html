<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود | پایش انقضا دیلی‌مارکت</title>
<link rel="stylesheet" href="style.css">
<style>
:root {
  --brand: #9F2136;
  --brand-deep: #721225;
  --white: #ffffff;
}
* {
  box-sizing: border-box;
}
html,
body {
  width: 100%;
  min-height: 100%;
  margin: 0;
}
body {
  overflow-x: hidden;
  color: var(--white);
  background: var(--brand);
  font-family: Vazirmatn, IRANSans, Tahoma, Arial, sans-serif;
}
button,
input {
  font: inherit;
}
.login-page {
  position: relative;
  min-height: 100vh;
  min-height: 100svh;
  display: grid;
  place-items: center;
  overflow: hidden;
  padding: 38px 20px;
  background:
    radial-gradient(circle at 50% 45%, rgba(255,255,255,.035), transparent 32%),
    var(--brand);
}
.login-stage {
  position: relative;
  width: min(100%, 430px);
}
.orb {
  position: absolute;
  z-index: 0;
  width: 220px;
  aspect-ratio: 1;
  border-radius: 50%;
  pointer-events: none;
  background:
    radial-gradient(circle at 30% 27%,
      #ffffff 0 16%,
      #fffefe 31%,
      #f8edef 57%,
      #e3cbd0 82%,
      #cfaab2 100%);
  box-shadow:
    inset -18px -22px 34px rgba(104,18,37,.17),
    0 0 32px rgba(255,255,255,.22),
    0 28px 55px rgba(65,4,17,.28);
}
.orb-top {
  top: -100px;
  left: -112px;
}
.orb-bottom {
  right: -118px;
  bottom: -104px;
}
.login-card {
  position: relative;
  z-index: 1;
  width: 100%;
  min-height: 580px;
  padding: 42px 42px 32px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  overflow: hidden;
  background:
    linear-gradient(145deg, rgba(54,5,17,.72), rgba(78,11,28,.58));
  border: 1px solid rgba(255,255,255,.25);
  border-radius: 12px;
  box-shadow:
    0 34px 72px rgba(54,3,15,.38),
    inset 0 1px 0 rgba(255,255,255,.17);
  -webkit-backdrop-filter: blur(20px) saturate(115%);
  backdrop-filter: blur(20px) saturate(115%);
}
.login-card::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(circle at -4% -3%, rgba(255,255,255,.26), transparent 31%),
    radial-gradient(circle at 104% 104%, rgba(255,255,255,.19), transparent 29%),
    linear-gradient(135deg, rgba(255,255,255,.08), transparent 38%);
}
.login-head {
  margin-bottom: 31px;
  text-align: center;
}
.logo {
  display: block;
  width: 220px;
  max-width: 72%;
  height: auto;
  margin: 0 auto 23px;
  filter: drop-shadow(0 5px 12px rgba(48,1,12,.18));
}
.login-head h1 {
  margin: 0 0 9px;
  color: #fff;
  font-size: 28px;
  font-weight: 800;
  line-height: 1.45;
}
.login-head p {
  margin: 0;
  color: rgba(255,255,255,.67);
  font-size: 12px;
  line-height: 1.9;
}
.alert {
  display: none;
  margin: 0 0 18px;
  padding: 12px 14px;
  color: #fff;
  background: rgba(51,2,13,.38);
  border: 1px solid rgba(255,255,255,.19);
  border-radius: 6px;
  font-size: 12px;
  line-height: 1.8;
}
.alert.show {
  display: block;
}
.field {
  margin-bottom: 20px;
}
.field label {
  display: block;
  margin-bottom: 8px;
  color: rgba(255,255,255,.92);
  font-size: 12px;
  font-weight: 700;
}
.field input {
  width: 100%;
  height: 54px;
  padding: 0 15px;
  color: #fff;
  background: rgba(38,2,11,.31);
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 5px;
  outline: none;
  transition: border-color .2s, background .2s, box-shadow .2s;
}
.field input::placeholder {
  color: rgba(255,255,255,.42);
}
.field input:hover {
  border-color: rgba(255,255,255,.30);
}
.field input:focus {
  background: rgba(33,1,9,.42);
  border-color: rgba(255,255,255,.68);
  box-shadow: 0 0 0 4px rgba(255,255,255,.09);
}
.login-button {
  width: 100%;
  height: 58px;
  margin-top: 15px;
  color: #86182c;
  background: #fff;
  border: 1px solid rgba(255,255,255,.82);
  border-radius: 5px;
  box-shadow: 0 15px 28px rgba(48,1,12,.24);
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  transition: transform .2s, background .2s, box-shadow .2s;
}
.login-button:hover:not(:disabled) {
  background: #fff7f8;
  box-shadow: 0 18px 32px rgba(48,1,12,.30);
  transform: translateY(-1px);
}
.login-button:active:not(:disabled) {
  transform: translateY(0);
}
.login-button:disabled {
  opacity: .65;
  cursor: wait;
}
.security-note {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  margin-top: 24px;
  color: rgba(255,255,255,.52);
  font-size: 10px;
}
.security-note svg {
  width: 14px;
  height: 14px;
}
@media (max-width: 620px) {
  .login-page {
    padding: 25px 16px;
  }
  .login-stage {
    width: min(100%, 390px);
  }
  .orb {
    width: 170px;
  }
  .orb-top {
    top: -70px;
    left: -80px;
  }
  .orb-bottom {
    right: -84px;
    bottom: -72px;
  }
  .login-card {
    min-height: 550px;
    padding: 34px 26px 27px;
    border-radius: 11px;
  }
  .logo {
    width: 190px;
    margin-bottom: 20px;
  }
  .login-head h1 {
    font-size: 25px;
  }
}
@media (max-width: 390px) {
  .login-card {
    min-height: 525px;
    padding-inline: 21px;
  }
  .orb {
    width: 145px;
  }
}
</style>
</head>

        <h1 id="loginTitle">ورود به سامانه</h1>
        <p>برای ادامه، اطلاعات حساب سازمانی خود را وارد کنید.</p>
      </header>

      <div id="alert" class="alert alert-error" role="alert"></div>

      <form id="loginForm">
        <div class="field">
          <label for="username">نام کاربری یا ایمیل کاری</label>
          <input type="text" id="username" required autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="نام کاربری یا ایمیل">
        </div>

        <div class="field">
          <label for="password">رمز عبور</label>
          <input type="password" id="password" required autocomplete="current-password" placeholder="رمز عبور">
        </div>

        <button type="submit" id="submitBtn" class="login-button">ورود به سامانه</button>
      </form>

      <div class="security-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <rect x="5" y="10" width="14" height="10" rx="2"></rect>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
        </svg>
        ورود امن ویژه کاربران مجاز دیلی‌مارکت
      </div>
    </section>
  </div>
</main>

<script src="auth.js"></script>

<script>
  const form = document.getElementById("loginForm");
  const alertEl = document.getElementById("alert");
  const submitBtn = document.getElementById("submitBtn");

  const APP_ROLE_PRIORITY = [
    "system_admin",
    "platform_admin",
    "ordering_deputy",
    "executive_manager",
    "region_manager",
    "store_operator"
  ];

  // Keep login routing self-contained. Older deployed auth.js versions do not
  // know about newly-added application roles such as ordering_deputy.
  const LOGIN_ROLE_HOME = Object.freeze({
    ...(typeof ROLE_HOME === "object" && ROLE_HOME ? ROLE_HOME : {}),
    ordering_deputy: "ordering-deputy-dashboard.html"
  });

  // Nhost با ایمیل احراز هویت می‌کند. نام‌های کاربری سازمانی در اینجا
  // فقط به ایمیل داخلی همان حساب تبدیل می‌شوند؛ هیچ رمزی در کد نگهداری نمی‌شود.
  const USERNAME_EMAIL_MAP = Object.freeze({
    tabarzadi: "tabarzadi@dailymarket.local"
  });

  function resolveLoginEmail(value) {
    const normalized = String(value || "").trim();

    if (!normalized) {
      throw new Error("نام کاربری یا ایمیل کاری را وارد کنید.");
    }

    if (normalized.includes("@")) {
      return normalized.toLowerCase();
    }

    const internalEmail = USERNAME_EMAIL_MAP[normalized.toLowerCase()];

    if (!internalEmail) {
      throw new Error("نام کاربری واردشده در سامانه تعریف نشده است.");
    }

    return internalEmail;
  }

  function showLoginError(message) {
    alertEl.textContent = nhFriendlyAuthError(message);
    alertEl.classList.add("show");
  }

  function clearLoginError() {
    alertEl.textContent = "";
    alertEl.classList.remove("show");
  }

  function setLoading(isLoading) {
    submitBtn.disabled = isLoading;
    submitBtn.textContent = isLoading ? "در حال ورود..." : "ورود به سامانه";
  }

  function isKnownAppRole(role) {
    return Boolean(role && LOGIN_ROLE_HOME[role]);
  }

  function redirectByRole(role) {
    const destination = LOGIN_ROLE_HOME[role];

    if (!destination) {
      throw new Error("برای این حساب، نقش معتبر سامانه تعریف نشده است.");
    }

    window.location.replace(destination);
  }

  async function getUserAppRole(userId, token, nhostDefaultRole) {
    // Nhost Auth is the source of truth for the active account role.
    // Use it first; query user_roles only as a fallback for legacy accounts.
    if (isKnownAppRole(nhostDefaultRole)) {
      return nhostDefaultRole;
    }

    const query = `
      query LoginUserRoles($userId: uuid!) {
        user_roles(
          where: { user_id: { _eq: $userId } }
        ) {
          role
        }
      }
    `;

    try {
      const data = await nhGql(
        query,
        { userId },
        token
      );

      const roles = (data.user_roles || [])
        .map(item => item.role)
        .filter(Boolean);

      for (const role of APP_ROLE_PRIORITY) {
        if (roles.includes(role)) {
          return role;
        }
      }
    } catch (error) {
      console.error("خطا در دریافت نقش کاربر:", error);
    }

    throw new Error(
      "ورود انجام شد، اما نقش این حساب در جدول user_roles پیدا نشد."
    );
  }

  function clearInvalidSession() {
    sessionStorage.removeItem("nhost_access_token");
    sessionStorage.removeItem("nhost_user_id");
    sessionStorage.removeItem("nhost_default_role");
  }

  const existingSession = nhSession();

  if (existingSession) {
    if (isKnownAppRole(existingSession.role)) {
      redirectByRole(existingSession.role);
    } else {
      clearInvalidSession();
    }
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    clearLoginError();
    setLoading(true);

    try {
      const email = resolveLoginEmail(
        document.getElementById("username").value
      );
      const password = document.getElementById("password").value;

      const response = await fetch(AUTH_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          email,
          password
        })
      });

      let data;

      try {
        data = await response.json();
      } catch (error) {
        throw new Error(
          "پاسخ نامعتبر از سرور دریافت شد. اتصال اینترنت را بررسی کنید."
        );
      }

      if (!response.ok || !data.session || !data.session.user) {
        throw new Error(
          data.message ||
          data.error ||
          "ورود ناموفق بود."
        );
      }

      const token = data.session.accessToken;
      const userId = data.session.user.id;
      const nhostDefaultRole = data.session.user.defaultRole;

      const appRole = await getUserAppRole(
        userId,
        token,
        nhostDefaultRole
      );

      sessionStorage.setItem("nhost_access_token", token);
      sessionStorage.setItem("nhost_user_id", userId);
      sessionStorage.setItem("nhost_default_role", appRole);

      redirectByRole(appRole);

    } catch (error) {
      clearInvalidSession();
      showLoginError(error.message || "ورود ناموفق بود.");
      setLoading(false);
    }
  });
</script>

</body>
</html>
